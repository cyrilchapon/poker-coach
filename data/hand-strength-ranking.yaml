# Classement des 169 types de mains de départ par équité brute contre une
# range "adversaire aléatoire" (22+,A2s+,...,32o -- littéralement deux cartes
# au hasard), calculée UNE FOIS via pokercoach.equity.equity() (Monte-Carlo,
# 15000 itérations, seed déterministe du moteur) et figée ici en donnée
# statique -- recalculer à chaque lancement de pc coûterait ~40s.
#
# Sert de base à ranges.table.top_pct_range() : les scénarios dérivés
# (vs_rfi, vs_limp, squeeze, vs_3bet, vs_4bet) ne connaissent qu'un
# pourcentage de continuation (ex. "~23%"), jamais une liste de mains --
# ce classement permet de matérialiser "le top 23%" en une vraie notation de
# range parseable (equity.parse_range), en cumulant les COMBOS (pas les
# types : 6 par paire, 4 par suited, 12 par offsuit) dans l'ordre de ce
# classement jusqu'au pourcentage demandé.
#
# Approximation documentée, pas un classement GTO : l'équité brute contre
# "n'importe quelle main" ignore la position, le format de table et la
# jouabilité postflop (un connecteur suité peut valoir plus que son équité
# brute ne le suggère). cf. README, section calibration.

