[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokercoach"
version = "2.0.0"
description = "Moteur déterministe du plugin poker-coach v2"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "eval7>=0.1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pc = "pokercoach.cli:main"

[tool.setuptools.packages.find]
where = ["skills/engine"]
include = ["pokercoach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
